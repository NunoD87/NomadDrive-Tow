name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build src/NomadDriveTow/NomadDriveTow.csproj -c Release -o out

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="dev-${GITHUB_SHA::7}"
          DIR="pkg/BepInEx/plugins/NomadDriveTow"
          mkdir -p "$DIR"
          cp out/NomadDriveTow.dll "$DIR/"
          cp README.md LICENSE "$DIR/" 2>/dev/null || true
          (cd pkg && zip -r "../NomadDriveTow-${VERSION}.zip" BepInEx)
          echo "ZIP=NomadDriveTow-${VERSION}.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: NomadDriveTow
          path: ${{ env.ZIP }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Automated build of ${GITHUB_REF_NAME}. Plugin only. Install BepInExPack_NomadDrive first (https://www.nexusmods.com/nomaddrive/mods/7), then unzip this into the game folder. See the README."
          FLAGS=""
          # Pre-1.0 builds are untested in-game: mark them as pre-releases.
          [[ "$GITHUB_REF_NAME" == v0.* ]] && FLAGS="--prerelease"
          gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --notes "$NOTES" $FLAGS
